[project]
name = "kuzgun"
version = "0.1.0"
description = "Kişisel terminal yapay zeka ajanı"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "ddgs>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13",
    "prompt_toolkit>=3",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
kuzgun = "kuzgun.cli:main"
kuzgun-server = "kuzgun.server:main"
kuzgun-client = "kuzgun.client:main"
kuzgun-bench = "kuzgun.bench:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kuzgun*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # satır uzunluğu formatter'a bırakılır
